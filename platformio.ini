; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Velocità monitor seriale per il debug
monitor_speed = 115200

; Velocità di caricamento (se fallisce, abbassala a 460800)
upload_speed = 921600

; --- LIBRERIE NECESSARIE ---
; Scarica automaticamente le versioni corrette
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    olikraus/U8g2 @ ^2.35.9
    thomasfredericks/Bounce2 @ ^2.72

; --- FLAG CRITICI PER C3 SUPERMINI ---
; Senza questi, la porta USB non funziona correttamente per Serial/Upload
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1